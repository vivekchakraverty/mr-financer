<?xml version="1.0" encoding="UTF-8"?>
<!--
  A deliberately broken filing. The parser handles its attributes perfectly
  correctly and still produces a wrong answer, which is the whole reason the
  validation layer exists.

  The current year carries scale="0" while the restated prior year carries
  scale="3" on an identically printed figure. The parser faithfully yields
  4,812 for 2024 and 4,812,000 for 2023. Both numbers look plausible on their
  own; together they are impossible.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ix="http://www.xbrl.org/2013/inlineXBRL"
      xmlns:xbrli="http://www.xbrl.org/2003/instance"
      xmlns:core="http://xbrl.frc.org.uk/fr/2021-01-01/core"
      xmlns:iso4217="http://www.xbrl.org/2003/iso4217">
<head><title>Annual accounts (malformed)</title></head>
<body>
<div style="display:none">
  <ix:header>
    <ix:resources>
      <xbrli:context id="FY2024">
        <xbrli:period>
          <xbrli:startDate>2023-04-01</xbrli:startDate>
          <xbrli:endDate>2024-03-31</xbrli:endDate>
        </xbrli:period>
      </xbrli:context>
      <xbrli:context id="FY2023">
        <xbrli:period>
          <xbrli:startDate>2022-04-01</xbrli:startDate>
          <xbrli:endDate>2023-03-31</xbrli:endDate>
        </xbrli:period>
      </xbrli:context>
      <xbrli:unit id="GBP">
        <xbrli:measure>iso4217:GBP</xbrli:measure>
      </xbrli:unit>
      <xbrli:unit id="pure">
        <xbrli:measure>xbrli:pure</xbrli:measure>
      </xbrli:unit>
    </ix:resources>
  </ix:header>
</div>

<table>
  <tr>
    <td>Turnover</td>
    <td><ix:nonFraction name="core:TurnoverRevenue" contextRef="FY2024"
        unitRef="GBP" scale="0" decimals="-3">4,812</ix:nonFraction></td>
    <td><ix:nonFraction name="core:TurnoverRevenue" contextRef="FY2023"
        unitRef="GBP" scale="3" decimals="-3">4,812</ix:nonFraction></td>
  </tr>
  <tr>
    <td>Average number of employees</td>
    <td><ix:nonFraction name="core:AverageNumberEmployeesDuringPeriod"
        contextRef="FY2024" unitRef="pure" decimals="0">27</ix:nonFraction></td>
  </tr>
</table>
</body>
</html>
